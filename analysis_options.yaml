include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - tool/**
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    # Single-method interfaces (DiceService, BotStrategy) are injection seams.
    one_member_abstracts: false
