name: dice_party
description: "Ludo & Snake Ladder: Snakes & Ladders and Ludo with local and Wi-Fi multiplayer."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  clock: ^1.1.2
  collection: ^1.19.1
  flame_audio: 2.12.2
  flutter:
    sdk: flutter
  flutter_riverpod: 3.3.1
  freezed_annotation: ^3.1.0
  go_router: 17.5.0
  json_annotation: ^4.11.0
  meta: ^1.16.0
  riverpod_annotation: ^4.0.2
  shared_preferences: ^2.5.6

dev_dependencies:
  build_runner: ^2.4.15
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  freezed: 3.2.5
  json_serializable: 6.13.0
  mocktail: ^1.0.5
  riverpod_generator: 4.0.3
  very_good_analysis: 10.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/manifest.json
    - assets/audio/
    - assets/shared/avatars/
    - assets/shared/brand/
    - assets/shared/cards/
    - assets/shared/dice/
    - assets/shared/fx/
    - assets/shared/hub/
    - assets/shared/icons/
    - assets/shared/tokens/
    - assets/shared/ui/
    - assets/games/snakes/boards/
    - assets/games/snakes/board_select/
    - assets/games/snakes/howto/
    - assets/games/snakes/themes/
    - assets/games/snakes/themes/jungle/
    - assets/games/snakes/themes/sunshine/
    - assets/games/snakes/themes/sweets/
    - assets/games/ludo/board/
    - assets/games/ludo/howto/
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
